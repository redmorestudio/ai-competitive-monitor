<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Management Test - AI Monitor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0f;
            color: #e0e0e0;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #00ff88;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .test-card {
            background: #1a1a1f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }
        .test-card h2 {
            color: #00ff88;
            margin: 0 0 20px 0;
            font-size: 1.2em;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin: 5px 0;
            font-size: 0.9em;
        }
        .status.success {
            background: #1b5e20;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .status.error {
            background: #b71c1c;
            color: #f44336;
            border: 1px solid #f44336;
        }
        .status.info {
            background: #0d47a1;
            color: #2196f3;
            border: 1px solid #2196f3;
        }
        .status.warning {
            background: #e65100;
            color: #ff9800;
            border: 1px solid #ff9800;
        }
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #00cc6a;
        }
        .data-display {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }
        .link-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .link-button {
            background: #673ab7;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 4px;
            display: inline-block;
            font-weight: bold;
        }
        .link-button:hover {
            background: #512da8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 Company Management System Test</h1>
        <p>Testing data loading and interface functionality</p>
    </div>

    <div class="link-buttons">
        <a href="manage-companies-postgres.html" class="link-button">📊 Company Manager (PostgreSQL)</a>
        <a href="manage-entities.html" class="link-button">🏷️ Entity Manager</a>
        <a href="manage-entities-enhanced.html" class="link-button">🏷️ Entity Manager (Enhanced)</a>
        <a href="index.html" class="link-button">🏠 Back to Dashboard</a>
    </div>

    <div class="test-grid">
        <div class="test-card">
            <h2>📊 Companies Data Test</h2>
            <button onclick="testCompaniesData()">Test Companies API</button>
            <div id="companies-status"></div>
            <div id="companies-data" class="data-display"></div>
        </div>

        <div class="test-card">
            <h2>🏷️ Entity Groups Test</h2>
            <button onclick="testEntityData()">Test Entity Groups API</button>
            <div id="entities-status"></div>
            <div id="entities-data" class="data-display"></div>
        </div>

        <div class="test-card">
            <h2>🔄 Changes Data Test</h2>
            <button onclick="testChangesData()">Test Changes API</button>
            <div id="changes-status"></div>
            <div id="changes-data" class="data-display"></div>
        </div>

        <div class="test-card">
            <h2>📈 Dashboard Data Test</h2>
            <button onclick="testDashboardData()">Test Dashboard API</button>
            <div id="dashboard-status"></div>
            <div id="dashboard-data" class="data-display"></div>
        </div>
    </div>

    <div class="test-card">
        <h2>🔍 System Status</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <div id="system-status"></div>
        <div class="data-display" id="summary"></div>
    </div>

    <script>
        const API_BASE = 'https://redmorestudio.github.io/ai-competitive-monitor/api-data';
        
        function showStatus(elementId, message, type = 'info') {
            const statusEl = document.getElementById(elementId);
            statusEl.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        function showData(elementId, data) {
            const dataEl = document.getElementById(elementId);
            dataEl.textContent = JSON.stringify(data, null, 2);
        }
        
        async function testCompaniesData() {
            showStatus('companies-status', '🔄 Loading companies data...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/companies.json?t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Handle both array and object with companies property
                const companies = Array.isArray(data) ? data : (data.companies || []);
                
                showStatus('companies-status', 
                    `✅ Loaded ${companies.length} companies successfully`, 
                    'success'
                );
                
                // Show sample data
                const sample = companies.slice(0, 3).map(c => ({
                    name: c.name,
                    category: c.category || c.type,
                    urls: c.urls ? c.urls.length : 0
                }));
                
                showData('companies-data', {
                    total: companies.length,
                    categories: [...new Set(companies.map(c => c.category || c.type))],
                    sample: sample
                });
                
            } catch (error) {
                showStatus('companies-status', `❌ Error: ${error.message}`, 'error');
                showData('companies-data', { error: error.message });
            }
        }
        
        async function testEntityData() {
            showStatus('entities-status', '🔄 Loading entity groups...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/entity-groups.json?t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                const entities = data.all_entities || [];
                const byType = data.by_type || {};
                
                showStatus('entities-status', 
                    `✅ Loaded ${entities.length} entity groups successfully`, 
                    'success'
                );
                
                // Calculate statistics
                const stats = {
                    total_entities: entities.length,
                    grouped: entities.filter(e => parseInt(e.variations) > 1).length,
                    types: Object.keys(byType),
                    sample: entities.slice(0, 3)
                };
                
                showData('entities-data', stats);
                
            } catch (error) {
                showStatus('entities-status', `❌ Error: ${error.message}`, 'error');
                showData('entities-data', { error: error.message });
            }
        }
        
        async function testChangesData() {
            showStatus('changes-status', '🔄 Loading changes data...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/changes.json?t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Handle both array and wrapped format
                const changes = Array.isArray(data) ? data : (data.changes || []);
                
                showStatus('changes-status', 
                    `✅ Loaded ${changes.length} changes successfully`, 
                    'success'
                );
                
                // Show recent changes
                const recent = changes.slice(0, 3).map(c => ({
                    company: c.company,
                    detected_at: c.detected_at || c.detectedAt,
                    interest_level: c.interest_level
                }));
                
                showData('changes-data', {
                    total: changes.length,
                    recent: recent,
                    high_interest: changes.filter(c => c.interest_level >= 7).length
                });
                
            } catch (error) {
                showStatus('changes-status', `❌ Error: ${error.message}`, 'error');
                showData('changes-data', { error: error.message });
            }
        }
        
        async function testDashboardData() {
            showStatus('dashboard-status', '🔄 Loading dashboard data...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/dashboard.json?t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                showStatus('dashboard-status', '✅ Dashboard data loaded successfully', 'success');
                
                // Extract key metrics
                const metrics = {
                    total_companies: data.companies ? data.companies.length : 0,
                    total_urls: data.total_urls || 0,
                    total_changes: data.total_changes || 0,
                    recent_changes: data.recent_changes_summary ? 
                        data.recent_changes_summary.last_5_changes.length : 0,
                    last_updated: data.last_updated || 'Unknown'
                };
                
                showData('dashboard-data', metrics);
                
            } catch (error) {
                showStatus('dashboard-status', `❌ Error: ${error.message}`, 'error');
                showData('dashboard-data', { error: error.message });
            }
        }
        
        async function runAllTests() {
            showStatus('system-status', '🔄 Running all tests...', 'info');
            
            const results = [];
            
            // Run tests sequentially to avoid overwhelming the server
            try {
                await testCompaniesData();
                results.push('✅ Companies data: OK');
            } catch (e) {
                results.push('❌ Companies data: FAILED');
            }
            
            try {
                await testEntityData();
                results.push('✅ Entity groups: OK');
            } catch (e) {
                results.push('❌ Entity groups: FAILED');
            }
            
            try {
                await testChangesData();
                results.push('✅ Changes data: OK');
            } catch (e) {
                results.push('❌ Changes data: FAILED');
            }
            
            try {
                await testDashboardData();
                results.push('✅ Dashboard data: OK');
            } catch (e) {
                results.push('❌ Dashboard data: FAILED');
            }
            
            const allPassed = results.every(r => r.includes('✅'));
            
            showStatus('system-status', 
                allPassed ? '✅ All tests passed!' : '⚠️ Some tests failed',
                allPassed ? 'success' : 'warning'
            );
            
            document.getElementById('summary').innerHTML = results.join('<br>');
        }
        
        // Run all tests on page load
        window.addEventListener('DOMContentLoaded', runAllTests);
    </script>
</body>
</html>
