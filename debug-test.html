<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Test</h1>
    <div id="output"></div>
    
    <script type="module">
        const output = document.getElementById('output');
        
        async function testModules() {
            const results = [];
            
            try {
                // Test each module import
                const modules = [
                    './js/modules/config.js',
                    './js/modules/utils.js',
                    './js/modules/api.js',
                    './js/modules/data.js',
                    './js/modules/version.js',
                    './js/modules/ui.js',
                    './js/modules/dashboard.js',
                    './js/modules/controls.js',
                    './js/modules/filters.js',
                    './js/modules/kwic.js',
                    './js/modules/main.js'
                ];
                
                for (const modulePath of modules) {
                    try {
                        const module = await import(modulePath);
                        results.push(`✅ ${modulePath} - Loaded`);
                    } catch (error) {
                        results.push(`❌ ${modulePath} - Error: ${error.message}`);
                        console.error(`Error loading ${modulePath}:`, error);
                    }
                }
                
            } catch (error) {
                results.push(`❌ Fatal error: ${error.message}`);
                console.error('Fatal error:', error);
            }
            
            output.innerHTML = '<pre>' + results.join('\n') + '</pre>';
        }
        
        testModules();
    </script>
</body>
</html>
