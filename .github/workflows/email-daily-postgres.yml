name: Email Daily Digest (PostgreSQL)

on:
  schedule:
    # Run at 2 PM UTC (9 AM EST / 8 AM CST) every day
    - cron: '0 14 * * *'
  
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Save to file instead of sending'
        type: boolean
        default: false

env:
  NODE_ENV: production

jobs:
  send-daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd github-actions-backend
          npm install --omit=dev
      
      - name: Send Daily Digest
        run: |
          cd github-actions-backend
          
          echo "📊 Generating and sending daily digest..."
          echo ""
          
          # Check if email is configured
          if [ -z "$SMTP_HOST" ]; then
            echo "📧 Email not configured, skipping daily digest"
            echo ""
            echo "To enable email notifications, configure these secrets:"
            echo "  - SMTP_HOST"
            echo "  - SMTP_USER"
            echo "  - SMTP_PASS"
            echo "  - NOTIFICATION_EMAIL"
            exit 0
          fi
          
          # Set test mode if requested
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            export EMAIL_TEST_MODE=true
            echo "🧪 Running in test mode - email will be saved to file"
          fi
          
          # Send daily digest
          node email-notifications-postgres.js daily
          
          echo ""
          echo "✅ Daily digest process completed"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      
      - name: Upload test emails (if test mode)
        if: ${{ inputs.test_mode == true }}
        uses: actions/upload-artifact@v3
        with:
          name: daily-digest-${{ github.run_id }}
          path: github-actions-backend/test-emails/
          retention-days: 7
      
      - name: Summary
        run: |
          echo "## 📊 Daily Digest Email" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Mode**: ${{ inputs.test_mode || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Schedule**: Daily at 2 PM UTC (9 AM EST / 8 AM CST)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The daily digest includes:" >> $GITHUB_STEP_SUMMARY
          echo "- All changes from the last 24 hours" >> $GITHUB_STEP_SUMMARY
          echo "- System health metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Priority-based change summaries" >> $GITHUB_STEP_SUMMARY
