name: Add Email Tracking Columns

on:
  workflow_dispatch:

jobs:
  add-email-columns:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd github-actions-backend
          npm install --omit=dev
      
      - name: Add Email Tracking Columns
        run: |
          cd github-actions-backend
          
          echo "📧 Adding email tracking columns to PostgreSQL database"
          echo "Using POSTGRES_CONNECTION_STRING from GitHub Secrets"
          echo ""
          
          # Run the migration script
          node add-email-tracking-columns-simple.js
          
          echo ""
          echo "✅ Email columns migration completed"
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          NODE_ENV: production
      
      - name: Verify Installation
        if: success()
        run: |
          cd github-actions-backend
          echo ""
          echo "🔍 Verifying email columns were added..."
          node -e "
          const { Client } = require('pg');
          (async () => {
            const client = new Client({
              connectionString: process.env.POSTGRES_CONNECTION_STRING,
              ssl: { rejectUnauthorized: false }
            });
            try {
              await client.connect();
              const result = await client.query(\`
                SELECT column_name, data_type 
                FROM information_schema.columns 
                WHERE table_schema = 'processed_content' 
                AND table_name = 'change_detection'
                AND column_name IN ('email_sent', 'email_sent_at')
                ORDER BY column_name
              \`);
              if (result.rows.length === 2) {
                console.log('✅ Email tracking columns verified:');
                result.rows.forEach(r => console.log('  -', r.column_name + ':', r.data_type));
              } else {
                console.log('⚠️ Expected 2 columns, found:', result.rows.length);
              }
            } catch (e) {
              console.error('Verification error:', e.message);
            } finally {
              await client.end();
            }
          })();
          "
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
