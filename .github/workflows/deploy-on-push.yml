name: Deploy to GitHub Pages on Push

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'js/**'
      - 'css/**'
      - 'api-data/**'
      - '.github/workflows/deploy-on-push.yml'

jobs:
  trigger-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync & Deploy Workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-deploy-postgres.yml',
              ref: 'main',
              inputs: {
                skip_thebrain: 'true',
                trigger_source: 'push-to-main'
              }
            });
            console.log('✅ Triggered sync-deploy-postgres workflow');