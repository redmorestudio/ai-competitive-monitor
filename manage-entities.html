<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Management - AI Competitive Monitor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
        }

        .stat-label {
            color: #888;
            margin-top: 5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .groups-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        .ungrouped-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box {
            background: #0f0f0f;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px 12px;
            color: #fff;
            width: 300px;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .group-card {
            background: #0f0f0f;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .group-card:hover {
            border-color: #666;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .group-card.drag-over {
            border-color: #4CAF50;
            background: #1a2a1a;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .group-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        .badge {
            background: #4CAF50;
            color: #000;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .variations {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .pill.primary {
            background: #1a3a1a;
            border-color: #4CAF50;
            font-weight: bold;
        }

        .pill.primary::before {
            content: '⭐';
            margin-right: 4px;
        }

        .pill.ungrouped {
            border-style: dashed;
            cursor: grab;
        }

        .pill.ungrouped:active {
            cursor: grabbing;
        }

        .pill:hover {
            background: #3a3a3a;
            border-color: #666;
        }

        .add-variation {
            background: transparent;
            border: 1px dashed #666;
            border-radius: 20px;
            padding: 4px 12px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-variation:hover {
            border-color: #4CAF50;
            color: #4CAF50;
        }

        .ungrouped-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: #4CAF50;
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #5CBF60;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .suggestions {
            margin-top: 20px;
        }

        .group-option {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .group-option:hover {
            border-color: #4CAF50;
            background: #1a2a1a;
        }

        .members {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }

        .close:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Entity Management</h1>
        <p class="subtitle">Group and normalize entities to reduce fragmentation and improve analysis</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalEntities">3,260</div>
                <div class="stat-label">Total Entities</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="groupedEntities">1,847</div>
                <div class="stat-label">Grouped Entities</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="ungroupedEntities">1,413</div>
                <div class="stat-label">Ungrouped Entities</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalGroups">234</div>
                <div class="stat-label">Entity Groups</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="groups-section">
                <div class="section-header">
                    <h2>Entity Groups</h2>
                    <input type="search" class="search-box" placeholder="Search groups...">
                </div>
                <div class="groups-grid" id="groupsGrid">
                    <!-- Groups will be loaded here -->
                </div>
            </div>

            <div class="ungrouped-section">
                <div class="section-header">
                    <h3>Ungrouped Entities</h3>
                </div>
                <div class="ungrouped-list" id="ungroupedList">
                    <!-- Ungrouped entities will be loaded here -->
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn" onclick="saveChanges()">Save Changes</button>
            <button class="btn btn-secondary" onclick="autoGroup()">Auto-Group Similar</button>
            <button class="btn btn-secondary" onclick="exportGroups()">Export Groups</button>
        </div>
    </div>

    <!-- Modal for grouping -->
    <div id="groupModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h3 id="modalTitle">Group Entity</h3>
            </div>
            <input type="search" class="search-box" placeholder="Search existing groups..." style="width: 100%;">
            <div class="suggestions" id="suggestions">
                <!-- Suggestions will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Sample data for demonstration
        const sampleGroups = [
            {
                id: 1,
                name: 'Machine Learning',
                variations: ['machine learning', 'ML', 'machine-learning', 'Machine Learning'],
                count: 15
            },
            {
                id: 2,
                name: 'Python Libraries',
                variations: ['scipy', 'numpy', 'pandas', 'matplotlib', 'scikit-learn'],
                count: 12
            },
            {
                id: 3,
                name: 'AI Models',
                variations: ['GPT-4', 'Claude', 'LLaMA', 'BERT', 'PaLM'],
                count: 8
            },
            {
                id: 4,
                name: 'Cloud Platforms',
                variations: ['AWS', 'Google Cloud', 'Azure', 'GCP', 'Amazon Web Services'],
                count: 7
            }
        ];

        const ungroupedEntities = [
            'tensorflow', 'pytorch', 'deep learning', 'neural networks',
            'kubernetes', 'docker', 'natural language processing', 'NLP',
            'computer vision', 'CV', 'reinforcement learning', 'RL'
        ];

        let selectedEntity = null;
        let draggedEntity = null;

        function loadGroups() {
            const grid = document.getElementById('groupsGrid');
            grid.innerHTML = sampleGroups.map(group => `
                <div class="group-card" data-group-id="${group.id}" 
                     ondrop="handleDrop(event)" 
                     ondragover="handleDragOver(event)"
                     ondragleave="handleDragLeave(event)">
                    <div class="group-header">
                        <span class="group-name">${group.name}</span>
                        <span class="badge">${group.count} variations</span>
                    </div>
                    <div class="variations">
                        ${group.variations.slice(0, 5).map((v, i) => 
                            `<span class="pill ${i === 0 ? 'primary' : ''}">${v}</span>`
                        ).join('')}
                        ${group.variations.length > 5 ? 
                            `<span class="pill">+${group.variations.length - 5} more</span>` : ''}
                        <button class="add-variation" onclick="addVariation(${group.id})">+</button>
                    </div>
                </div>
            `).join('');
        }

        function loadUngrouped() {
            const list = document.getElementById('ungroupedList');
            list.innerHTML = ungroupedEntities.map(entity => 
                `<span class="pill ungrouped" 
                       draggable="true" 
                       ondragstart="handleDragStart(event, '${entity}')"
                       onclick="showGroupModal('${entity}')">${entity}</span>`
            ).join('');
        }

        function handleDragStart(e, entity) {
            draggedEntity = entity;
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            const groupId = e.currentTarget.dataset.groupId;
            console.log(`Adding "${draggedEntity}" to group ${groupId}`);
            
            // Here you would make an API call to add the entity to the group
            // For demo, just remove from ungrouped list
            const index = ungroupedEntities.indexOf(draggedEntity);
            if (index > -1) {
                ungroupedEntities.splice(index, 1);
                loadUngrouped();
                
                // Update stats
                document.getElementById('ungroupedEntities').textContent = 
                    parseInt(document.getElementById('ungroupedEntities').textContent) - 1;
                document.getElementById('groupedEntities').textContent = 
                    parseInt(document.getElementById('groupedEntities').textContent) + 1;
            }
        }

        function showGroupModal(entity) {
            selectedEntity = entity;
            document.getElementById('modalTitle').textContent = `Group "${entity}"`;
            document.getElementById('groupModal').style.display = 'block';
            
            // Load suggestions
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = `
                ${sampleGroups.map(group => `
                    <div class="group-option" onclick="addToGroup('${entity}', ${group.id})">
                        <strong>${group.name}</strong>
                        <div class="members">${group.variations.slice(0, 3).join(', ')}...</div>
                    </div>
                `).join('')}
                <div class="group-option" onclick="createNewGroup('${entity}')">
                    <strong>+ Create New Group</strong>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('groupModal').style.display = 'none';
        }

        function addToGroup(entity, groupId) {
            console.log(`Adding "${entity}" to group ${groupId}`);
            closeModal();
            // Update UI
            const index = ungroupedEntities.indexOf(entity);
            if (index > -1) {
                ungroupedEntities.splice(index, 1);
                loadUngrouped();
            }
        }

        function createNewGroup(entity) {
            const name = prompt('Enter group name:');
            if (name) {
                console.log(`Creating new group "${name}" with entity "${entity}"`);
                closeModal();
            }
        }

        function saveChanges() {
            alert('Changes saved! (Demo only)');
        }

        function autoGroup() {
            alert('Auto-grouping would analyze entities for similarities and suggest groupings');
        }

        function exportGroups() {
            alert('Export would download entity groups as JSON');
        }

        // Initialize
        loadGroups();
        loadUngrouped();

        // Close modal on outside click
        window.onclick = function(event) {
            if (event.target.className === 'modal') {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
